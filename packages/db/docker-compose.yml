name: edgecoms-academy

services:
  postgres:
    image: postgres:18
    container_name: edgecoms-academy-postgres
    environment:
      POSTGRES_DB: edgecoms-academy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - edgecoms-academy_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  edgecoms-academy_postgres_data:
