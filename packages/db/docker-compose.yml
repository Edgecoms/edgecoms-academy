name: edgecoms-academy

services:
  postgres:
    image: postgres:18
    container_name: edgecoms-academy-postgres
    environment:
      POSTGRES_DB: edgecoms-academy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - edgecoms-academy_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mail:
    image: axllent/mailpit:latest
    container_name: edgecoms-academy-mail
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_MAX_MESSAGES: 500
    restart: unless-stopped

volumes:
  edgecoms-academy_postgres_data:
